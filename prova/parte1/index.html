<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parte 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="square">

            <div class="header Dblue">
                Painel de Análise de Produtos
            </div>

            <div class="inserts">

                <input type="texto" value="Nome do Produto" id="name">

                <input type="texto" value="Preco (R$)" id="price">

                <input type="texto" value="Quantidade" id="quantity">

                <button id="button">Adicionar Produto</button>

            </div>

            <div class="main">

                <div class="box orange">
                    <div class="boxheader Dorange">
                        Produto Mais Caro
                    </div>

                    <div class="info" id="1">teste</div>

                </div>

                <div class="box green">
                    <div class="boxheader Dgreen">
                        Maior Quantidade
                    </div>

                    <div class="info" id="2">teste</div>

                </div>

                <div class="box blue">
                    <div class="boxheader Dblue">
                        Valor Total em Estoque
                    </div>

                    <div class="info" id="3">teste</div>

                </div>

            </div>

        </div>

    </div>
    
</body>
</html>
