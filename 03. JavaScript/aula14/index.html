const somaCategoria = vendas.reduce((acc, venda) => {
    acc[venda.categoria] = (acc[venda.categoria] || 0) + (venda.preco * venda.quantidade)
    return acc
}, {})

const qtdCategoria = vendas.reduce((acc, venda) => {
    acc[venda.categoria] = (acc[venda.categoria] || 0) + venda.quantidade
    return acc
}, {})

const faturamentoCidade = vendas.reduce((acc, venda) => {
    acc[venda.cidade] = (acc[venda.cidade] || 0) + (venda.preco * venda.quantidade)
    return acc
}, {})

const pedidosCidade = vendas.reduce((acc, venda) => {
    acc[venda.cidade] = (acc[venda.cidade] || 0) + 1
    return acc
}, {})

const totalCliente = vendas.reduce((acc, venda) => {
    acc[venda.cliente] = (acc[venda.cliente] || 0) + (venda.preco * venda.quantidade)

const vendasMes = vendas.reduce((acc, venda) => {
    const mes = venda.data.split('-')[1]
    acc[mes] = (acc[mes] || 0) + (venda.preco * venda.quantidade)
